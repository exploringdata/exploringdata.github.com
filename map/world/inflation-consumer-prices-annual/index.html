<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World Inflation Map - Annual Consumer Price Changes (%) | Exploring Data</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive world map of annual inflation (%) from 1960 to 2024, showing consumer price changes per country in constant 2015 US dollars.">
    <meta property="og:image" content="/img/preview/inflation-consumer-prices-annual.png">
  <meta name="author" content="Ramiro Gómez">
  <link rel="canonical" href="https://exploring-data.com/map/world/inflation-consumer-prices-annual/">

<link rel="stylesheet" href="/css/fullpage.css">

<link rel="stylesheet" href="/vendor/npm/subject-mapper.css">

  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="alternate" type="application/rss+xml" title="Exploring Data RSS feed" href="https://exploring-data.com/rss.xml">
</head>

<body>


<div id="app"></div>
<script type="module">
import { createMap, fetchWorldBank, worldBankUrl } from '/compiled/subjectmap.js';

const INDICATOR = 'FP.CPI.TOTL.ZG';
const data = await fetchWorldBank(INDICATOR);

createMap(document.getElementById('app'), {
  data,
  clampPercentile: 3,   // clip the most extreme % from each end
  topoUrl:     '/topojson/world/countries.json',
  topoObject:  'units',
  title:       'Inflation, consumer prices',
  emoji:       '💸',
  unit:        'annual %',
  colorScheme: 'Greens',
  sourceUrl:   worldBankUrl(INDICATOR),
  sourceLabel: `data.worldbank.org/indicator/${INDICATOR}`,
});
</script>
<a id="logo-link" href="/"><img src="/img/exploring-data.png" alt="Exploring Data"></a>





<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
</body>
</html>
