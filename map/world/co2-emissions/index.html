<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World Map of Countries by CO2 Emissions per Capita | Exploring Data</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="These choropleth maps show CO2 emissions in metric tons per capita based on data from the Carbon Dioxide Information Analysis Center and Oak Ridge National Laboratory.">
    <meta property="og:image" content="/img/preview/co2-emissions.png">
  <meta name="author" content="Ramiro Gómez">
  <link rel="canonical" href="https://exploring-data.com/map/world/co2-emissions/">

<link rel="stylesheet" href="/css/fullpage.css">

<link rel="stylesheet" href="/vendor/npm/subject-mapper.css">

  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="alternate" type="application/rss+xml" title="Exploring Data RSS feed" href="https://exploring-data.com/rss.xml">
</head>

<body>


<div id="app"></div>
<script type="module">
import { createMap, fetchWorldBank, worldBankUrl } from '/compiled/subjectmap.js';

const INDICATOR = 'EN.GHG.CO2.PC.CE.AR5';
const data = await fetchWorldBank(INDICATOR);

createMap(document.getElementById('app'), {
  data,
  clampPercentile: 1.5,   // clip the most extreme % from each end
  topoUrl:     '/topojson/world/countries.json',
  topoObject:  'units',
  title:       'CO2 Emissions',
  emoji:       '👣',
  unit:        'Tonnes per Capita',
  colorScheme: 'Blues',
  sourceUrl:   worldBankUrl(INDICATOR),
  sourceLabel: `data.worldbank.org/indicator/${INDICATOR}`,
});
</script>
<a id="logo-link" href="/"><img src="/img/exploring-data.png" alt="Exploring Data"></a>





<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
</body>
</html>
