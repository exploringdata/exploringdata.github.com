<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World Map of Countries by Forest Area Percentage of Land Area | Exploring Data</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="These choropleth maps show the forest area percentage of land area for the world's countries based on data from the Food and Agriculture Organization.">
    <meta property="og:image" content="/img/preview/forest-area.png">
  <meta name="author" content="Ramiro Gómez">
  <link rel="canonical" href="https://exploring-data.com/map/world/forest-area/">

<link rel="stylesheet" href="/css/fullpage.css">

<link rel="stylesheet" href="/vendor/npm/subject-mapper.css">

  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="alternate" type="application/rss+xml" title="Exploring Data RSS feed" href="https://exploring-data.com/rss.xml">
</head>

<body>


<div id="app"></div>
<script type="module">
import { createMap, fetchWorldBank, worldBankUrl } from '/compiled/subjectmap.js';

const INDICATOR = 'AG.LND.FRST.ZS';
const data = await fetchWorldBank(INDICATOR);

createMap(document.getElementById('app'), {
  data,
  topoUrl:     '/topojson/world/countries.json',
  topoObject:  'units',
  title:       'Forest Area',
  emoji:       '🌳',
  subtitle:    `${INDICATOR} · % of land area`,
  unit:        '% of land area',
  colorScheme: 'Greens',
  sourceUrl:   worldBankUrl(INDICATOR),
  sourceLabel: `data.worldbank.org/indicator/${INDICATOR}`,
});
</script>
<a id="logo-link" href="/"><img src="/img/exploring-data.png" alt="Exploring Data"></a>





<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
</body>
</html>
